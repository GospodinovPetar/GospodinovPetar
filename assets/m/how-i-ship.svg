<svg xmlns="http://www.w3.org/2000/svg" xml:space="preserve" viewBox="0 0 420 684" width="420" height="684" role="img" aria-labelledby="title desc">
  <title id="title">How I ship</title>
  <desc id="desc">How I ship: one branch per environment. dev runs lint, test, build and push; a merge request promotes the same image to test, another to prod behind a migration gate; each deploys with Helm to its own AKS cluster, watched by Grafana, Prometheus and Sentry.</desc>
  <defs>
    <linearGradient id="name" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a78bfa"/><stop offset=".55" stop-color="#38bdf8"/><stop offset="1" stop-color="#34d399"/>
    </linearGradient>
    <linearGradient id="wipe" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0f111a" stop-opacity="0"/><stop offset=".16" stop-color="#0f111a"/><stop offset="1" stop-color="#0f111a"/>
    </linearGradient>
  </defs>
  <style>
    text { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; fill: #e6edf3; white-space: pre; }
    .p { fill: #34d399; font-weight: 700; }
    .c { fill: #6e7681; font-style: italic; }
    .k { fill: #a78bfa; }
    .s { fill: #a5d6ff; }
    .ok { fill: #3fb950; }
    .w { fill: #f2cc60; }
    .e { fill: #ff7b72; font-weight: 700; }
    .dim { fill: #8b949e; }
    .cy { fill: #38bdf8; }
    .b { font-weight: 700; }
    .name { fill: url(#name); font-weight: 800; }
    .title { fill: #8b949e; font-size: 12px; }
    .o { animation: pop .01s linear both; }
    .rise { animation: rise .8s cubic-bezier(.2,.8,.2,1) both; }
    .blink { animation: blink 1.1s steps(1) infinite; }
    @keyframes rise { from { opacity: 0; transform: translateY(8px); } }
    @keyframes type { from { transform: translateX(0); } }
    @keyframes pop { from { opacity: 0; } }
    @keyframes curs { from, to { opacity: 1; } }
    @keyframes blink { 50% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }

    .node { fill: #1d1e2e; stroke: #3a3563; stroke-width: 1.5; }
    .chip { fill: #26253b; stroke: #3a3563; stroke-width: 1; }
    .wave { animation: wave 9s ease-in-out infinite; }
    .tap { fill: none; stroke: #3fb950; stroke-width: 1.5; stroke-dasharray: 3 5; opacity: .7; animation: march .9s linear infinite; }
    .ring { fill: none; stroke: #3fb950; stroke-width: 1.5; transform-box: fill-box; transform-origin: center; animation: ping 2s ease-out infinite; }
    .spark { fill: none; stroke: #3fb950; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    .rule { fill: rgba(63, 185, 80, .08); stroke: #2f6f3a; stroke-width: 1; }
    @keyframes wave { 0%, 14%, 100% { stroke: #3a3563; stroke-width: 1.5; } 4% { stroke: #e9e4ff; stroke-width: 2.5; } }
    @keyframes march { to { stroke-dashoffset: -11; } }
    @keyframes ping { 0% { transform: scale(1); opacity: .8; } 100% { transform: scale(2.8); opacity: 0; } }
    .tok { animation: tok 9s linear infinite; }
    @keyframes tok { 0.00% { transform: translate(34.0px, 125.0px); opacity: 0.00; } 4.44% { transform: translate(34.0px, 125.0px); opacity: 1.00; } 33.33% { transform: translate(34.0px, 125.0px); opacity: 1.00; } 34.26% { transform: translate(34.0px, 127.4px); opacity: 1.00; } 35.19% { transform: translate(34.0px, 134.4px); opacity: 1.00; } 36.11% { transform: translate(34.0px, 145.5px); opacity: 1.00; } 37.04% { transform: translate(34.0px, 160.0px); opacity: 1.00; } 37.96% { transform: translate(34.0px, 176.9px); opacity: 1.00; } 38.89% { transform: translate(34.0px, 195.0px); opacity: 1.00; } 39.81% { transform: translate(34.0px, 213.1px); opacity: 1.00; } 40.74% { transform: translate(34.0px, 230.0px); opacity: 1.00; } 41.67% { transform: translate(34.0px, 244.5px); opacity: 1.00; } 42.59% { transform: translate(34.0px, 255.6px); opacity: 1.00; } 43.52% { transform: translate(34.0px, 262.6px); opacity: 1.00; } 44.44% { transform: translate(34.0px, 265.0px); opacity: 1.00; } 57.78% { transform: translate(34.0px, 265.0px); opacity: 1.00; } 58.67% { transform: translate(34.0px, 266.5px); opacity: 1.00; } 59.56% { transform: translate(34.0px, 271.1px); opacity: 1.00; } 60.44% { transform: translate(34.0px, 278.4px); opacity: 1.00; } 61.33% { transform: translate(34.0px, 288.2px); opacity: 1.00; } 62.22% { transform: translate(34.0px, 300.0px); opacity: 1.00; } 63.11% { transform: translate(34.0px, 313.4px); opacity: 1.00; } 64.00% { transform: translate(34.0px, 327.7px); opacity: 1.00; } 64.89% { transform: translate(34.0px, 342.3px); opacity: 1.00; } 65.78% { transform: translate(34.0px, 356.6px); opacity: 1.00; } 66.67% { transform: translate(34.0px, 370.0px); opacity: 1.00; } 67.56% { transform: translate(34.0px, 381.8px); opacity: 1.00; } 68.44% { transform: translate(34.0px, 391.6px); opacity: 1.00; } 69.33% { transform: translate(34.0px, 398.9px); opacity: 1.00; } 70.22% { transform: translate(34.0px, 403.5px); opacity: 1.00; } 71.11% { transform: translate(34.0px, 405.0px); opacity: 1.00; } 93.33% { transform: translate(34.0px, 405.0px); opacity: 1.00; } 100.00% { transform: translate(34.0px, 405.0px); opacity: 0.00; } }
</style>
