<svg xmlns="http://www.w3.org/2000/svg" xml:space="preserve" viewBox="0 0 1000 167" width="1000" height="167" role="img" aria-labelledby="title desc">
  <title id="title">exit</title>
  <desc id="desc">Thanks for stopping by.</desc>
  <defs>
    <linearGradient id="name" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a78bfa"/><stop offset=".55" stop-color="#38bdf8"/><stop offset="1" stop-color="#34d399"/>
    </linearGradient>
    <linearGradient id="wipe" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0f111a" stop-opacity="0"/><stop offset=".16" stop-color="#0f111a"/><stop offset="1" stop-color="#0f111a"/>
    </linearGradient>
  </defs>
  <style>
    text { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; fill: #e6edf3; white-space: pre; }
    .p { fill: #34d399; font-weight: 700; }
    .c { fill: #6e7681; font-style: italic; }
    .k { fill: #a78bfa; }
    .s { fill: #a5d6ff; }
    .ok { fill: #3fb950; }
    .w { fill: #f2cc60; }
    .e { fill: #ff7b72; font-weight: 700; }
    .dim { fill: #8b949e; }
    .cy { fill: #38bdf8; }
    .b { font-weight: 700; }
    .name { fill: url(#name); font-weight: 800; }
    .title { fill: #8b949e; font-size: 12px; }
    .o { animation: pop .01s linear both; }
    .rise { animation: rise .8s cubic-bezier(.2,.8,.2,1) both; }
    .blink { animation: blink 1.1s steps(1) infinite; }
    @keyframes rise { from { opacity: 0; transform: translateY(8px); } }
    @keyframes type { from { transform: translateX(0); } }
    @keyframes pop { from { opacity: 0; } }
    @keyframes curs { from, to { opacity: 1; } }
    @keyframes blink { 50% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
  <rect x=".75" y=".75" width="998.5" height="165.5" rx="12" fill="#0f111a"/>
  <path d="M.75 36V12.75A12 12 0 0 1 12.75 .75H987.25A12 12 0 0 1 999.25 12.75V36z" fill="#171a24"/>
  <path d="M.75 36.5H999.25" stroke="#2a2f3d"/>
  <circle cx="20" cy="18" r="6" fill="#ff5f57"/><circle cx="40" cy="18" r="6" fill="#febc2e"/><circle cx="60" cy="18" r="6" fill="#28c840"/>
  <text x="500.0" y="22" class="title" text-anchor="middle">petar@sofia: ~</text>
  
    <text x="28" y="72" font-size="14" class="p o" style="animation-delay:0.20s">$</text>
  <text x="44.8" y="72" font-size="14">exit</text>
  <g style="transform:translateX(42.0px);animation:type 0.25s steps(5) 0.40s both"><rect x="44.8" y="58.7" width="58.8" height="23" fill="#0f111a"/><rect x="44.8" y="60.8" width="8.4" height="13.3" fill="#e6edf3" style="opacity:0;animation:curs 0.25s linear 0.40s"/></g>
  <text x="28" y="95" font-size="14" class="o " style="animation-delay:1.00s"><tspan class="dim">logout</tspan></text>
  <text x="28" y="118" font-size="14" class="o " style="animation-delay:1.30s"><tspan class="">thanks for stopping by — </tspan><tspan class="ok">see you in prod.</tspan></text>
  <text x="28" y="141" font-size="14" class="o " style="animation-delay:1.60s"><tspan class="dim">Connection to github.com closed.</tspan></text>
  <rect x=".75" y=".75" width="998.5" height="165.5" rx="12" fill="none" stroke="#2a2f3d" stroke-width="1.5"/>
