<svg xmlns="http://www.w3.org/2000/svg" xml:space="preserve" viewBox="0 0 1000 546" width="1000" height="546" role="img" aria-labelledby="title desc">
  <title id="title">Petar Gospodinov</title>
  <desc id="desc">Petar Gospodinov: full-stack engineer working on DevOps and AI in Sofia, Bulgaria. Works at INDUSTRIA Technology and studies for an MSc in Artificial Intelligence at TU Sofia. Owns the release flow: one image promoted dev to test to prod. Led the CSP rollout. Builds agents that fact-check their own numbers. Says early when a plan won't hold, and brings a fix.</desc>
