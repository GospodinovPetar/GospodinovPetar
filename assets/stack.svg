<svg xmlns="http://www.w3.org/2000/svg" xml:space="preserve" viewBox="0 0 1000 319" width="1000" height="319" role="img" aria-labelledby="title desc">
  <title id="title">Stack</title>
  <desc id="desc">My stack as YAML. ai: claude-code, openrouter, agno, groq. platform: kubernetes/aks, azure, helm, docker, traefik, linux. delivery: gitlab-ci, github-actions, git. observability: grafana, prometheus, sentry. backend: python, django, django-cms, fastapi, celery. data: postgresql, redis, sqlite. frontend: javascript, htmx, alpine.js, tailwind. security: csp, input-validation, gdpr/onetrust.</desc>
  <defs>
    <linearGradient id="name" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a78bfa"/><stop offset=".55" stop-color="#38bdf8"/><stop offset="1" stop-color="#34d399"/>
    </linearGradient>
    <linearGradient id="wipe" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0f111a" stop-opacity="0"/><stop offset=".16" stop-color="#0f111a"/><stop offset="1" stop-color="#0f111a"/>
    </linearGradient>
  </defs>
  <style>
    text { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; fill: #e6edf3; white-space: pre; }
    .p { fill: #34d399; font-weight: 700; }
    .c { fill: #6e7681; font-style: italic; }
    .k { fill: #a78bfa; }
    .s { fill: #a5d6ff; }
    .ok { fill: #3fb950; }
    .w { fill: #f2cc60; }
    .e { fill: #ff7b72; font-weight: 700; }
    .dim { fill: #8b949e; }
    .cy { fill: #38bdf8; }
    .b { font-weight: 700; }
    .name { fill: url(#name); font-weight: 800; }
    .title { fill: #8b949e; font-size: 12px; }
    .o { animation: pop .01s linear both; }
    .rise { animation: rise .8s cubic-bezier(.2,.8,.2,1) both; }
    .blink { animation: blink 1.1s steps(1) infinite; }
    @keyframes rise { from { opacity: 0; transform: translateY(8px); } }
    @keyframes type { from { transform: translateX(0); } }
    @keyframes pop { from { opacity: 0; } }
    @keyframes curs { from, to { opacity: 1; } }
    @keyframes blink { 50% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
  <rect x=".75" y=".75" width="998.5" height="317.5" rx="12" fill="#0f111a"/>
  <path d="M.75 36V12.75A12 12 0 0 1 12.75 .75H987.25A12 12 0 0 1 999.25 12.75V36z" fill="#171a24"/>
  <path d="M.75 36.5H999.25" stroke="#2a2f3d"/>
  <circle cx="20" cy="18" r="6" fill="#ff5f57"/><circle cx="40" cy="18" r="6" fill="#febc2e"/><circle cx="60" cy="18" r="6" fill="#28c840"/>
  <text x="500.0" y="22" class="title" text-anchor="middle">petar@sofia: ~/dotfiles</text>
  
    <text x="28" y="72" font-size="14" class="p o" style="animation-delay:0.20s">$</text>
  <text x="44.8" y="72" font-size="14">cat stack.yaml</text>
  <g style="transform:translateX(126.0px);animation:type 0.75s steps(15) 0.40s both"><rect x="44.8" y="58.7" width="142.8" height="23" fill="#0f111a"/><rect x="44.8" y="60.8" width="8.4" height="13.3" fill="#e6edf3" style="opacity:0;animation:curs 0.75s linear 0.40s"/></g>
  <text x="28" y="101.9" font-size="14" class="o " style="animation-delay:1.50s"><tspan class="k">ai:</tspan><tspan x="162.4" class="dim">[</tspan><tspan class="s">claude-code, openrouter, agno, groq</tspan><tspan class="dim">]</tspan><tspan x="640.0" class="c"># pair-programs with me daily</tspan></text>
  <text x="28" y="124.9" font-size="14" class="o " style="animation-delay:1.59s"><tspan class="k">platform:</tspan><tspan x="162.4" class="dim">[</tspan><tspan class="s">kubernetes/aks, azure, helm, docker, traefik, linux</tspan><tspan class="dim">]</tspan><tspan x="640.0" class="c"># multi-cluster, one image</tspan></text>
  <text x="28" y="147.9" font-size="14" class="o " style="animation-delay:1.68s"><tspan class="k">delivery:</tspan><tspan x="162.4" class="dim">[</tspan><tspan class="s">gitlab-ci, github-actions, git</tspan><tspan class="dim">]</tspan><tspan x="640.0" class="c"># one branch per env</tspan></text>
  <text x="28" y="170.9" font-size="14" class="o " style="animation-delay:1.77s"><tspan class="k">observability:</tspan><tspan x="162.4" class="dim">[</tspan><tspan class="s">grafana, prometheus, sentry</tspan><tspan class="dim">]</tspan><tspan x="640.0" class="c"># no dashboard, didn't happen</tspan></text>
  <text x="28" y="193.9" font-size="14" class="o " style="animation-delay:1.86s"><tspan class="k">backend:</tspan><tspan x="162.4" class="dim">[</tspan><tspan class="s">python, django, django-cms, fastapi, celery</tspan><tspan class="dim">]</tspan><tspan x="640.0" class="c"># django cms in production</tspan></text>
  <text x="28" y="216.9" font-size="14" class="o " style="animation-delay:1.95s"><tspan class="k">data:</tspan><tspan x="162.4" class="dim">[</tspan><tspan class="s">postgresql, redis, sqlite</tspan><tspan class="dim">]</tspan><tspan x="640.0" class="c"># cache with stale fallback</tspan></text>
  <text x="28" y="239.9" font-size="14" class="o " style="animation-delay:2.04s"><tspan class="k">frontend:</tspan><tspan x="162.4" class="dim">[</tspan><tspan class="s">javascript, htmx, alpine.js, tailwind</tspan><tspan class="dim">]</tspan><tspan x="640.0" class="c"># js only where it earns it</tspan></text>
  <text x="28" y="262.9" font-size="14" class="o " style="animation-delay:2.13s"><tspan class="k">security:</tspan><tspan x="162.4" class="dim">[</tspan><tspan class="s">csp, input-validation, gdpr/onetrust</tspan><tspan class="dim">]</tspan><tspan x="640.0" class="c"># led the CSP rollout</tspan></text>
  <g class="o" style="animation-delay:2.42s"><text x="28" y="292.79999999999995" font-size="14" class="p">$</text><rect x="44.8" y="281.6" width="8.4" height="13.3" fill="#e6edf3" class="blink"/></g>
  <rect x=".75" y=".75" width="998.5" height="317.5" rx="12" fill="none" stroke="#2a2f3d" stroke-width="1.5"/>
</svg>
