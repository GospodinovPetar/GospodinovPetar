  <title id="title">Projects</title>
  <desc id="desc">My projects: imotko (ai-agent, Running): fact-checks its own numbers, built with agno · openrouter; nodeguard (security, Running): scanners are plugins, built with django · htmx · docker; commit-generator (ai-cli, Completed): scrubs secrets before sending, built with groq · gpt-oss-120b; boardgamenexus (cloud, Running): OIDC deploy to Azure, built with django · redis · azure.</desc>
